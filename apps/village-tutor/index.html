<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Tutor</title>
<style>
  :root{--bg:#10130c;--panel:#1a1f12;--panel2:#222a16;--line:#39431f;--ink:#f3f6e8;--mut:#aab18a;--ok:#a3d44a;--accent:#ffd56b;--me:#2b3a52}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#243016,#10130c);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;margin:0}
  .badge{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .langs{display:flex;gap:6px;margin-left:auto}
  .langs button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
  .langs button.on{background:var(--ok);border-color:var(--ok);color:#10130c;font-weight:700}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px}
  .chips button{font:inherit;font-size:13px;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  .chips button:hover{border-color:var(--accent);color:var(--ink)}
  #log{flex:1;overflow:auto;padding:10px 22px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:11px 14px;border-radius:14px;white-space:pre-wrap}
  .bot{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px}
  .me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
  .meta{font-size:11px;color:var(--mut);margin-top:4px}
  form{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
  input{flex:1;font:inherit;background:#0c0f08;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px}
  form button{font:inherit;background:var(--accent);border:none;color:#10130c;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Village Tutor</h1>
  <span class="badge" id="mode">offline</span>
  <div class="langs">
    <button data-l="en" class="on">English</button>
    <button data-l="sw">Kiswahili</button>
    <button data-l="es">Espanol</button>
  </div>
</header>
<div class="chips" id="chips"></div>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask me anything, or type a sum like 7 + 5" autocomplete="off"><button>Send</button></form>
<script>
const $=s=>document.querySelector(s);
let lang='en';
const hi={en:"Hello! I am your tutor. Pick a topic below or ask a question.",
  sw:"Jambo! Mimi ni mwalimu wako. Chagua mada hapa chini au uliza swali.",
  es:"Hola! Soy tu tutor. Elige un tema abajo o haz una pregunta."};
function add(text,who,meta){
  const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m);}
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;
}
async function ask(q){
  add(q,'me');
  let d; try{ d=await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,lang})})).json(); }
  catch(e){ add('(offline error)','bot'); return; }
  add(d.answer,'bot',`${d.topic} · ${d.source}`);
}
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';ask(q);};
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('on',x===b));
});
async function init(){
  const h=await (await fetch('/api/health')).json();
  $('#mode').textContent=h.mode;
  $('#chips').innerHTML=h.topics.map(t=>`<button>${t}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
  add(hi[lang],'bot');
}
init();
</script>
</body>
</html>
