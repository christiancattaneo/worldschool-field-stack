<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Research Assistant</title>
<style>
  :root{--bg:#0b0e16;--panel:#141a28;--panel2:#1b2336;--line:#2a3450;--ink:#eaf0fb;--mut:#8b97b8;--accent:#c08bff;--me:#23314f}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#231a44,#0b0e16);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;margin:0}
  .badge{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .starters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px}
  .starters button{font:inherit;font-size:13px;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
  .starters button:hover{border-color:var(--accent);color:var(--ink)}
  #log{flex:1;overflow:auto;padding:12px 24px;display:flex;flex-direction:column;gap:12px;max-width:900px;margin:0 auto;width:100%}
  .msg{max-width:84%;padding:12px 15px;border-radius:14px;white-space:pre-wrap}
  .bot{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px}
  .me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
  .think{color:var(--mut);font-style:italic}
  form{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);max-width:900px;margin:0 auto;width:100%}
  textarea{flex:1;font:inherit;background:#090c14;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;resize:none;height:46px}
  form button{font:inherit;background:var(--accent);border:none;color:#0b0e16;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Field Research Assistant</h1>
  <span class="badge" id="model">checking…</span>
  <span class="badge">method, not answers</span>
</header>
<div class="starters" id="starters"></div>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Describe a curiosity, e.g. 'tree frog calls near the river change at night'…"></textarea><button>Send</button></form>
<script>
const $=s=>document.querySelector(s);
let history=[];
const starters=[
  "Help me turn 'tree frogs in the Amazon' into a researchable question.",
  "What evidence would I need to study clean water and child health?",
  "How do I tell if a source on solar microgrids is credible?",
  "Steelman the counterargument to my hydroponics-in-dry-regions idea.",
];
function add(text,who){
  const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
  $('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight;return d;
}
async function send(text){
  add(text,'me'); history.push({role:'user',content:text});
  const thinking=add('thinking…','bot');thinking.classList.add('think');
  let d; try{ d=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})})).json(); }
  catch(e){ thinking.textContent='(network error)'; return; }
  thinking.remove();
  add(d.reply,'bot'); history.push({role:'assistant',content:d.reply});
}
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';send(q);};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit();}};
async function init(){
  const h=await (await fetch('/api/health')).json();
  $('#model').textContent=h.available?('Claude · '+h.model):'offline (no key)';
  $('#starters').innerHTML=starters.map(s=>`<button>${s}</button>`).join('');
  $('#starters').querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.textContent));
  add('I am your research mentor. Tell me what you are curious about and I will help you make it a real, testable question. I will not make up sources, I will show you how to verify.','bot');
}
init();
</script>
</body>
</html>
