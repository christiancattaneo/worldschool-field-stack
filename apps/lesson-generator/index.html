<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Plan Generator</title>
<style>
  :root{--bg:#0c130f;--panel:#142019;--panel2:#1a2a20;--line:#264433;--ink:#eafaf0;--mut:#92b8a2;--accent:#56e08c}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#173a28,#0c130f);color:var(--ink)}
  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  .badge{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .wrap{max-width:820px;margin:0 auto;padding:22px 26px 60px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{color:var(--mut);font-size:12px}
  input,select{font:inherit;background:#0a110d;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px}
  #topic{min-width:280px}
  button{font:inherit;background:var(--accent);border:none;color:#0c130f;font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .lesson{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;white-space:pre-wrap;min-height:120px;line-height:1.6}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>Lesson Plan Generator</h1>
  <span class="badge" id="model">checking…</span>
  <span class="badge">low-resource, offline classroom</span>
</header>
<div class="wrap">
  <div class="controls">
    <div class="ctl" style="flex:1"><label>Topic</label><input id="topic" placeholder="e.g. clean water and why we boil it"></div>
    <div class="ctl"><label>Age</label><input id="age" type="number" min="4" max="18" value="9" style="width:80px"></div>
    <div class="ctl"><label>Language</label><select id="lang"><option value="en">English</option><option value="sw">Kiswahili</option><option value="es">Espanol</option></select></div>
    <button id="go">Generate lesson</button>
  </div>
  <div class="row"><span class="badge" id="status">Pick a topic and generate a ready-to-teach plan.</span><button class="ghost" id="copy" style="display:none">Copy</button></div>
  <div class="lesson" id="lesson"></div>
</div>
<script>
const $=s=>document.querySelector(s);
$('#go').onclick=async()=>{
  const topic=$('#topic').value.trim(); if(!topic){$('#status').textContent='Enter a topic first.';return;}
  $('#status').textContent='writing lesson…'; $('#go').disabled=true; $('#lesson').textContent='';
  try{
    const d=await (await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic,age:+$('#age').value,lang:$('#lang').value})})).json();
    $('#lesson').textContent=d.lesson;
    $('#status').textContent=d.available?'Ready. Edit as needed, then print or write on the board.':'Offline mode.';
    $('#copy').style.display=d.lesson?'inline-block':'none';
  }catch(e){ $('#status').textContent='(network error)'; }
  $('#go').disabled=false;
};
$('#copy').onclick=()=>{navigator.clipboard.writeText($('#lesson').textContent);$('#status').textContent='Copied to clipboard.';};
(async()=>{const h=await (await fetch('/api/health')).json();$('#model').textContent=h.available?('Claude · '+h.model):'offline (no key)';})();
</script>
</body>
</html>
